<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
        }

        .login-card {
            border-radius: 16px;
        }

        .login-icon {
            font-size: 3rem;
            color: #0d6efd;
        }
    </style>
</head>

<body class="d-flex align-items-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">

                <div class="card login-card shadow-lg border-0">
                    <div class="card-body p-4">

                        <div class="text-center mb-4">
                            <i class="bi bi-shield-lock login-icon"></i>
                            <h4 class="mt-2">Secure Login</h4>
                            <small class="text-muted">Silakan masuk ke akun Anda</small>
                        </div>

                        <form onsubmit="return validateLogin()">

                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-person"></i>
                                    </span>
                                    <input type="text" class="form-control" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-lock"></i>
                                    </span>
                                    <input type="password" class="form-control" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    CAPTCHA: <strong id="captchaQuestion"></strong>
                                </label>
                                <input type="number" id="captchaAnswer" class="form-control"
                                    placeholder="Jawaban CAPTCHA" required>
                            </div>

                            <div class="d-grid">
                                <button class="btn btn-primary btn-lg">
                                    <i class="bi bi-box-arrow-in-right"></i> Login
                                </button>
                            </div>
                        </form>

                        <div id="errorMsg" class="alert alert-danger mt-3 d-none text-center">
                            CAPTCHA salah
                        </div>

                    </div>
                </div>

                <p class="text-center text-white mt-3 small">
                    © 2026 Sistem Login
                </p>

            </div>
        </div>
    </div>

    <script>
        let captchaResult = 0;

        function generateCaptcha() {
            const a = Math.floor(Math.random() * 10) + 1;
            const b = Math.floor(Math.random() * 10) + 1;
            captchaResult = a + b;
            document.getElementById('captchaQuestion').innerText = `${a} + ${b}`;
        }

        function validateLogin() {
            const answer = document.getElementById('captchaAnswer').value;
            const error = document.getElementById('errorMsg');

            if (parseInt(answer) !== captchaResult) {
                error.classList.remove('d-none');
                generateCaptcha();
                return false;
            }

            error.classList.add('d-none');
            alert('Login berhasil (CAPTCHA valid)');
            return false; // ganti true jika sudah ke backend
        }

        document.addEventListener('DOMContentLoaded', generateCaptcha);
    </script>

</body>

</html>
